name: Add contribution to the gallery

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process manually"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  add-piece:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'contribution') ||
      contains(github.event.issue.body, '### Image') ||
      contains(github.event.issue.body, '### Gallery section')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure contribution label
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['contribution']
              });
            } catch (e) {
              console.log('Could not add label:', e.message);
            }

      - name: Process contribution
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node scripts/process-contribution.js

      - name: Commit new piece
        run: |
          git config user.name "museum-curator[bot]"
          git config user.email "actions@github.com"
          git add images/sons data/manifest.json
          git diff --cached --quiet || git commit -m "Add contribution from issue #${{ github.event.issue.number || inputs.issue_number }}"
          git push

      - name: Comment and close issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "It's hung. Thanks for the donation — check the gallery in a minute once the site rebuilds. 🖼️",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      - name: Comment on failure
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Couldn't process this one automatically — a human curator will need to take a look. Common cause: the image wasn't dragged directly into the Image box.",
            });
