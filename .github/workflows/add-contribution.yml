name: Add contribution to the gallery

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-piece:
    if: contains(github.event.issue.labels.*.name, 'contribution')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process contribution
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/process-contribution.js

      - name: Commit new piece
        run: |
          git config user.name "museum-curator[bot]"
          git config user.email "actions@github.com"
          git add images/sons data/manifest.json
          git diff --cached --quiet || git commit -m "Add contribution from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment and close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "It's hung. Thanks for the donation — check the gallery in a minute once the site rebuilds. 🖼️",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Couldn't process this one automatically — a human curator will need to take a look. Common cause: the image wasn't dragged directly into the Image box.",
            });
